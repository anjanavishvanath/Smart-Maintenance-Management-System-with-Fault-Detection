# PreSense Mosquitto broker configuration
# ----------------------------------------
# This configuration is intentionally permissive for the development demo: the
# broker accepts anonymous connections so newly-flashed ESP32 devices can
# publish telemetry using whatever credentials the activate_device endpoint
# issued, without Mosquitto having to know about every individual device.
#
# IMPORTANT — production hardening (tracked in IMPROVEMENTS.md "Stronger device auth"):
#   * Install an auth plugin such as mosquitto-go-auth and point it at the
#     `devices` table so the broker validates each connection's username
#     (the device MAC) against `mqtt_password`.
#   * Set `allow_anonymous false` once the auth plugin is in place.
#   * Add TLS on port 8883 with a CA-issued certificate and require
#     `require_certificate true` for stronger device identity.

persistence true
persistence_location /mosquitto/data/
# Cap the in-memory message queue per client so a misbehaving subscriber can't
# pin RAM. 1000 messages is plenty for the 200 Hz batched telemetry pattern.
max_queued_messages 1000

# Log to both file and docker console so we can `docker logs` and tail the file.
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true

# --- TCP listener (devices + ingestor) ---
listener 1883 0.0.0.0
allow_anonymous true

# --- WebSocket listener (browser-side debugging tools) ---
listener 9001 0.0.0.0
protocol websockets

# --- ACL template (commented out; uncomment once auth is in place) ---
# acl_file /mosquitto/config/acl
# Suggested ACL contents:
#   user presense_ingestor
#   topic readwrite presense/#
#   topic write cmd/clear_cache
#
#   pattern read presense/%u/#
#   pattern write presense/%u/#
